<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty • Status</title>
  <style>
    :root{--text:#0f172a;--muted:#475569;--border:rgba(15,23,42,.12);--bg:#f1f5f9;--card:#fff;--accent:#1f2937}
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:var(--text);background:var(--bg)}
    .container{max-width:900px;margin:0 auto;padding:16px}
    .top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px}
    .title{font-size:22px;font-weight:800}
    .back{font-size:13px;color:var(--muted);text-decoration:underline}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 18px rgba(15,23,42,.08);padding:16px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .col{flex:1;min-width:240px}
    .field{display:grid;gap:6px;margin-bottom:10px}
    .label{font-size:13px;color:var(--muted)}
    .select,.input,textarea{height:40px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}
    textarea{height:84px;resize:vertical}
    .btn{height:40px;padding:0 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
    .note{color:var(--muted);font-size:13px;margin-top:8px}
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <div class="title">Status</div>
      <a class="back" href="index.html">← Back</a>
    </div>

    <section class="card">
      <div class="row">
        <div class="col"><div class="field"><span class="label">Current Status</span>
          <select class="select">
            <option value="">— Select —</option>
            <option>Available (In Office)</option>
            <option>In Class</option>
            <option>Meeting</option>
            <option>On Break</option>
            <option>Out</option>
            <option>Do Not Disturb</option>
          </select>
        </div></div>
        <div class="col"><div class="field"><span class="label">Until (optional)</span><input class="input" type="time" /></div></div>
      </div>
      <div class="field"><span class="label">Note (optional)</span><textarea placeholder="Short note e.g., 'Meeting till 3:30 PM'"></textarea></div>
      <button class="btn" type="button">Update Status</button>
      <div class="note">Static mock. Later we’ll auto-expire statuses and log changes.</div>
    </section>
  </div>
</body>
</html>
