<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty • Home</title>
  <style>
    :root{--text:#0f172a;--muted:#475569;--border:rgba(15,23,42,.12);--bg:#f1f5f9;--card:#fff;--accent:#1f2937}
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:var(--text);background:var(--bg)}
    .container{max-width:1100px;margin:0 auto;padding:16px}
    .top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px}
    .title{font-size:22px;font-weight:800}
    .back{font-size:13px;color:var(--muted);text-decoration:underline}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:640px){.grid{grid-template-columns:1fr}}
    .bigbtn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:100px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:#fff;color:#0f172a;text-decoration:none;box-shadow:0 6px 18px rgba(15,23,42,.06)}
    .bigbtn:hover{background:#111827;color:#fff;border-color:#111827}
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <div class="title">Faculty</div>
      <a class="back" href="../login.html">← Back to Login</a>
    </div>

    <div class="grid">
      <a class="bigbtn" href="scan.html">Scan QR</a>
      <a class="bigbtn" href="status.html">Status</a>
      <a class="bigbtn" href="logs.php">Logs</a>
    </div>
  </div>
</body>
</html>
