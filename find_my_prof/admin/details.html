<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin • Building Details</title>
  <style>
    :root{--text:#0f172a;--muted:#475569;--border:rgba(15,23,42,.12);--bg:#f1f5f9;--card:#fff;--accent:#1f2937}
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:var(--text);background:var(--bg)}
    .container{max-width:1100px;margin:0 auto;padding:16px}
    .top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px}
    .title{font-size:22px;font-weight:800}
    .back{font-size:13px;color:var(--muted);text-decoration:underline}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 18px rgba(15,23,42,.08);padding:16px}
    .field{display:grid;gap:6px;margin-bottom:10px}
    .label{font-size:13px;color:var(--muted)}
    .input,.select,textarea{height:40px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}
    textarea{height:84px;resize:vertical}
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <div class="title">Building Details</div>
      <a class="back" href="admin.html">← Back to Dashboard</a>
    </div>

    <section class="card">
      <div class="field"><span class="label">Select Building</span>
        <select class="select">
          <option value="">— none —</option>
        </select>
      </div>
      <div class="field"><span class="label">Building Name</span><input class="input" type="text" placeholder="—" /></div>
      <div class="field"><span class="label">Building Code</span><input class="input" type="text" placeholder="—" /></div>
      <div class="field"><span class="label">Description</span><textarea placeholder="—"></textarea></div>
      <button style="height:40px;padding:0 14px;border-radius:8px;border:0;background:#1f2937;color:#fff;cursor:pointer">Save Changes</button>
      <p class="back" style="margin-top:8px">Static mock only. No database yet.</p>
    </section>
  </div>
</body>
</html>
