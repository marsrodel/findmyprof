<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin • Logs</title>
  <style>
    :root{--text:#0f172a;--muted:#475569;--border:rgba(15,23,42,.12);--bg:#f1f5f9;--card:#fff}
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:var(--text);background:var(--bg)}
    .container{max-width:1100px;margin:0 auto;padding:16px}
    .top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px}
    .title{font-size:22px;font-weight:800}
    .back{font-size:13px;color:var(--muted);text-decoration:underline}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 18px rgba(15,23,42,.08);padding:16px}
    .table{width:100%;border-collapse:collapse}
    .table th,.table td{border-bottom:1px dashed var(--border);text-align:left;padding:8px}
    .note{color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <div class="title">Logs</div>
      <a class="back" href="admin.html">← Back to Dashboard</a>
    </div>

    <section class="card" style="margin-bottom:12px">
      <h3 style="margin:0 0 6px;font-size:16px">Instructor Logs</h3>
      <table class="table">
        <thead><tr><th>Time</th><th>Instructor</th><th>Action</th><th>Source</th></tr></thead>
        <tbody>
          <tr><td colspan="4" class="note">No logs yet.</td></tr>
        </tbody>
      </table>
    </section>

    <section class="card">
      <h3 style="margin:0 0 6px;font-size:16px">Room Logs</h3>
      <table class="table">
        <thead><tr><th>Time</th><th>Room</th><th>Status</th><th>By</th></tr></thead>
        <tbody>
          <tr><td colspan="4" class="note">No logs yet.</td></tr>
        </tbody>
      </table>
    </section>
  </div>
</body>
</html>
