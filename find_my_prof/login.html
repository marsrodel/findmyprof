<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    :root {
      --text: #0f172a; /* slate-900 */
      --muted: #475569; /* slate-600 */
      --border: rgba(15, 23, 42, 0.12);
      --card: #ffffff;
      --button: #1f2937;
      --button-hover: #111827;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: #f1f5f9; /* simple neutral bg */
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      padding: 26px 26px 18px;
    }
    .title {
      margin: 6px 0 18px;
      font-size: 28px;
      letter-spacing: 0.08em;
      font-weight: 800;
      text-align: center;
    }
    .form { display: grid; gap: 14px; }
    .field { display: grid; gap: 6px; }
    .label { font-size: 14px; color: var(--muted); }
    .input {
      height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: box-shadow .2s ease, border-color .2s ease;
    }
    .input:focus {
      border-color: #1f2937;
      box-shadow: 0 0 0 3px rgba(31, 41, 55, 0.18);
    }
    .btn {
      height: 44px;
      border-radius: 10px;
      border: 0;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
      background: var(--button);
      color: #fff;
    }
    .btn:hover { background: var(--button-hover); }
    .links {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .link { color: var(--text); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
    .guest { display: inline-flex; align-items: center; gap: 8px; }
    .icon { display: inline-flex; color: #111827; }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title">LOGIN</h1>
    <form class="form" action="auth/login.php" method="post">
      <label class="field">
        <span class="label">Email</span>
        <input class="input" type="email" name="email" placeholder="Value" required />
      </label>

      <label class="field">
        <span class="label">Password</span>
        <input class="input" type="password" name="password" placeholder="Value" required />
      </label>

      <button class="btn" type="submit">Login</button>

      <div class="links">
        <a class="link" href="#">Forgot password?</a>
        <a class="link guest" href="view.html" title="Login as a Guest">
          <span class="icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <span>Login as a Guest</span>
        </a>
      </div>
    </form>
  </main>
  <script>
    (function(){
      const params = new URLSearchParams(location.search);
      const err = params.get('error');
      if(!err) return;
      const map = {
        empty: 'Please enter both email and password.',
        invalid: 'Incorrect email or password.',
        default: 'Login failed. Please try again.'
      };
      const msg = map[err] || map.default;
      const div = document.createElement('div');
      div.textContent = msg;
      div.style.cssText = 'margin-top:10px;color:#b91c1c;background:#fee2e2;border:1px solid #fecaca;padding:8px 12px;border-radius:8px;font-size:14px;';
      document.querySelector('main.card').appendChild(div);
    })();
  </script>
</body>
</html>
